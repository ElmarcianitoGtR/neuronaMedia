version: '3.8'

services:
  graph-db:
    image: memgraph/memgraph-platform:latest
    container_name: graph-db
    profiles: ["core", "dev", "full"]
    ports:
      - "7687:7687"  
      - "2340:2340"   
    volumes:
      - memgraph-data:/var/lib/memgraph

  pdf-renderer:
    image: gotenberg/gotenberg:8
    container_name: mitsubishi-pdf-headless
    profiles: ["headless", "full"]
    ports:
      - "4650:3000" 

  master-slave-backend:
    build:
      context: .
      dockerfile: master-slave/backend/Dockerfile
      target: dev
    container_name: ms-backend
    profiles: ["master-slave-dev", "full"]
    environment:
      - NODE_ENV=development
      - SIMULATE_TELEMETRY=true
    ports:
      - "3000:3000"
      - "4000:4000/udp" # UDP Port for MATLAB Simulink
    volumes:
      - .:/app                          # Mount source for hot-reload
      - backend_node_modules:/app/node_modules  # Isolate container's node_modules from host

  master-slave-db:
    image: postgres:15-alpine
    container_name: ms-postgres
    profiles: ["master-slave-dev", "full"]
    environment:
      POSTGRES_USER: ms_user
      POSTGRES_PASSWORD: ms_password
      POSTGRES_DB: ms_database
    ports:
      - "5432:5432"
    volumes:
      - ms_pgdata:/var/lib/postgresql/data

  master-slave-frontend:
    build:
      context: .
      dockerfile: master-slave/frontend/Dockerfile
      target: dev
    container_name: ms-frontend
    profiles: ["master-slave-dev", "full"]
    environment:
      - VITE_TENANT_NAME=${TENANT_NAME:-CANACINTRA CORP}
      - VITE_TENANT_LOGO=${TENANT_LOGO:-}
      - NODE_ENV=development
    ports:
      - "5173:5173"
    volumes:
      - .:/app                           # Mount source for hot-reload
      - frontend_node_modules:/app/node_modules  # Isolate container's node_modules from host

  quality-hub:
    build:
      context: .
      dockerfile: reports/quality-hub/Dockerfile
      target: dev
    container_name: quality-hub
    profiles: ["master-slave-dev", "full"]
    environment:
      - NODE_ENV=development
      - PDF_RENDERER_URL=http://pdf-renderer:3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "4321:4321"
    volumes:
      - .:/app
      - reports_node_modules:/app/node_modules

volumes:
  memgraph-data:
  backend_node_modules:
  frontend_node_modules:
  reports_node_modules:
  ms_pgdata:
