version: '3.8'

services:
  graph-db:
    image: memgraph/memgraph-platform:latest
    container_name: graph-db-prod
    ports:
      - "7687:7687"  
      - "2340:2340"   
    volumes:
      - memgraph-data:/var/lib/memgraph
    restart: always

  pdf-renderer:
    image: gotenberg/gotenberg:8
    container_name: mitsubishi-pdf-headless-prod
    restart: always

  master-slave-backend:
    build:
      context: .
      dockerfile: master-slave/backend/Dockerfile
      target: prod
    container_name: ms-backend-prod
    environment:
      - NODE_ENV=production
      - SIMULATE_TELEMETRY=false
      - DEBUG_UDP=false
      - DB_HOST=ms-postgres-prod
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-ms_user}
      - DB_PASS=${POSTGRES_PASSWORD:-ms_password}
      - DB_NAME=${POSTGRES_DB:-ms_database}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - FRONTEND_URL=https://${DOMAIN_NAME}
    ports:
      - "4000:4000/udp"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.${DOMAIN_NAME}`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=cloudflare"
      - "traefik.http.services.backend.loadbalancer.server.port=3000"
    depends_on:
      - master-slave-db
    restart: always
    networks:
      - default
      - proxy

  master-slave-db:
    image: postgres:15-alpine
    container_name: ms-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ms_password}
      POSTGRES_DB: ${POSTGRES_DB:-ms_database}
    volumes:
      - ms_pgdata_prod:/var/lib/postgresql/data
    restart: always

  master-slave-frontend:
    build:
      context: .
      dockerfile: master-slave/frontend/Dockerfile
      target: prod
      args:
        - VITE_BACKEND_URL=https://api.${DOMAIN_NAME}
        - VITE_REPORTS_URL=https://reports.${DOMAIN_NAME}
    container_name: ms-frontend-prod
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=cloudflare"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    restart: always
    networks:
      - default
      - proxy

  quality-hub:
    build:
      context: .
      dockerfile: reports/quality-hub/Dockerfile
      target: prod
    container_name: quality-hub-prod
    environment:
      - NODE_ENV=production
      - PDF_RENDERER_URL=http://pdf-renderer:3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GRAPH_DB_URI=bolt://graph-db:7687
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.quality-hub.rule=Host(`reports.${DOMAIN_NAME}`)"
      - "traefik.http.routers.quality-hub.entrypoints=websecure"
      - "traefik.http.routers.quality-hub.tls.certresolver=cloudflare"
      - "traefik.http.services.quality-hub.loadbalancer.server.port=4321"
    depends_on:
      - graph-db
      - pdf-renderer
    restart: always
    networks:
      - default
      - proxy

  slides:
    build:
      context: .
      dockerfile: docs/slides/Dockerfile
      target: prod
    container_name: slides-prod
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.slides.rule=Host(`slides.${DOMAIN_NAME}`)"
      - "traefik.http.routers.slides.entrypoints=websecure"
      - "traefik.http.routers.slides.tls.certresolver=cloudflare"
      - "traefik.http.services.slides.loadbalancer.server.port=80"
    restart: always
    networks:
      - default
      - proxy

networks:
  proxy:
    external: true

volumes:
  memgraph-data:
  ms_pgdata_prod:
